# ===================================================================
# Основные настройки приложения и сервера
# ===================================================================
spring.application.name=Date
server.port=8000
server.error.include-message=always

# ===================================================================
# Настройки подключения к базе данных (PostgreSQL)
# ===================================================================
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5143/campus_booking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ===================================================================
# Настройки JPA / Hibernate
# ===================================================================
spring.jpa.database=postgresql
spring.jpa.show-sql=false
# Идеально для продакшена, когда структура контролируется миграциями (Flyway)
spring.jpa.hibernate.ddl-auto=validate
# Защита от Anti-pattern Open-In-View (утечки пула соединений)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Настройки миграций Flyway
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.clean-disabled=true

# ===================================================================
# Интеграция с внешним API БГПУ и безопасность
# ===================================================================
bgpu.access-secret-key=${BGPU_ACCESS_SECRET_KEY:default_super_secret_key_at_least_256_bits_long_for_local_dev_only!!!}
bgpu.user-api.url=${BGPU_USER_API_URL:https://edu28.ru}
bgpu.points-api.url=${BGPU_POINTS_API_URL:https://edu28.ru}

# Таймауты для RestTemplate/RestClient при запросах к БГПУ
app.integration.bgpu.connect-timeout-ms=3000
app.integration.bgpu.read-timeout-ms=5000

# ===================================================================
# Бизнес-лимиты подсистемы бронирования
# ===================================================================
booking.max-records-per-day=3
booking.max-days-ahead=7

# ===================================================================
# Настройки логирования и вывода в консоль
# ===================================================================
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Уровни логирования для системных пакетов (убираем лишний спам)
logging.level.root=INFO
logging.level.ru.bgpu.campus=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.context.annotation.ConfigurationClassParser=WARN
logging.level.org.hibernate=ERROR
logging.level.org.flywaydb=INFO

# ===================================================================
# Конфигурация SpringDoc OpenAPI (Swagger UI)
# ===================================================================
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
springdoc.packages-to-scan=ru.bgpu.campus

# Пути к документации и UI интерфейсу
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Метаданные спецификации API
springdoc.openapi.info.title=Campus BGPU API
springdoc.openapi.info.description=API для системы управления кампусом общежития БГПУ
springdoc.openapi.info.version=1.0.0
springdoc.openapi.info.contact.name=BGPU Development Team
springdoc.openapi.info.contact.email=dev@bgpu.edu

# Список серверов в Swagger UI
springdoc.openapi.servers[0].url=http://localhost:8000
springdoc.openapi.servers[0].description=Local Development Server

